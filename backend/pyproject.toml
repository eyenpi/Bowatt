[project]
name = "bowatt-research-agent-backend"
version = "0.1.0"
description = "Backend scaffold for a streaming research agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "httpx2>=2.12",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: exercises the API through a live HTTP server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
